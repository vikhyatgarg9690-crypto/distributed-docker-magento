[www]

user = www-data
group = www-data

listen = 9000

pm = dynamic

pm.max_children = 80
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

pm.max_requests = 500

request_terminate_timeout = 1800

catch_workers_output = yes

clear_env = no

php_admin_value[memory_limit] = 4G
